name: contributions

on:
  schedule:
    - cron: "17 2 * * *"      # daily, 02:17 UTC
  workflow_dispatch:           # manual run from the Actions tab
  push:
    paths:
      - scripts/contributions.py

permissions:
  contents: write

concurrency:
  group: contributions
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate assets/contributions.svg
        env:
          # Optional PAT (read:user) lets private contributions count.
          # Falls back to the built-in token (public contributions only).
          GH_TOKEN: ${{ secrets.PROFILE_PAT || secrets.GITHUB_TOKEN }}
          PROFILE_LOGIN: ${{ github.repository_owner }}
        run: python3 scripts/contributions.py

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain assets/contributions.svg)" ]; then
            echo "No change."; exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contributions.svg
          git commit -m "chore: update contributions graph"
          git push

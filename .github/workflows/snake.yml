name: Snake

on:
  schedule:
    - cron: "17 */12 * * *"   # twice a day, off the hour to avoid peak queueing
  workflow_dispatch:           # manual run: Actions -> Snake -> Run workflow
  push:
    branches: [main, master]
    paths:
      - ".github/workflows/snake.yml"

permissions:
  contents: write              # required to push the generated files to the "output" branch

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    name: Generate and publish snake
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake from the contribution graph
        uses: Platane/snk/svg-only@v3
        env:
          GITHUB_TOKEN: ${{ github.token }}   # read by snk; the default token avoids API rate limits
        with:
          github_user_name: Ujwalushettigar
          github_token: ${{ github.token }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Check both files were generated
        run: |
          set -euo pipefail
          ls -l dist
          test -s dist/github-contribution-grid-snake.svg
          test -s dist/github-contribution-grid-snake-dark.svg

      - name: Publish to the output branch (created if missing)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd dist
          git init --quiet --initial-branch=output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit --quiet -m "Update contribution snake"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" output
